version: '3.8'

services:
  oncovit-api:
    container_name: oncovit-sankhya-api
    build:
      context: .
      dockerfile: Dockerfile
    image: oncovit-sankhya-api:1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=America/Sao_Paulo
      - JAVA_OPTS=-Xms128m -Xmx384m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=portainer_default"
      - "traefik.http.routers.oncovit.rule=Host(`api-oncovit.celsoladislau.com`)"
      - "traefik.http.routers.oncovit.entrypoints=websecure"
      - "traefik.http.services.oncovit.loadbalancer.server.port=8080"
      - "traefik.http.routers.oncovit.service=oncovit"
      - "traefik.http.routers.oncovit.tls.certresolver=leresolver"
    networks:
      - portainer_default
      - default

networks:
  portainer_default:
    external: true
