server:
  port: 8080
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: oncovit-sankhya-med-sync

  datasource:
    url: jdbc:h2:mem:oncovitdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: true

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui/index.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Parâmetros de Simulação e Negócio do ERP Sankhya
oncovit:
  sankhya:
    app-key: "oncovit-medsync-api-key-2026"
    token: "bearer sankhya-session-jwt-token-example"
    empresa-padrao: 1
    centro-custo: "10200-FARMACIA-ONCO"

sankhya:
  api:
    app-key: "oncovit-medsync-api-key-2026"
    token: "bearer sankhya-session-jwt-token-example"
